function networkScene(){let n=Math.min(34,3+Math.floor(points/15));let nodes=Array.from({length:n},(_,i)=>({x:24+(i*79)%272,y:18+(i*53)%118}));return `<div class="home-network"><svg viewBox="0 0 320 155" role="img" aria-label="${n} glowing connections"><defs><filter id="homeGlow" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="3.5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>${nodes.map((a,i)=>{let b=nodes[(i+3)%n];return `<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="#65ffe3" stroke-width="2.8" class="spark-link" filter="url(#homeGlow)" style="animation-delay:${i*.09}s"/>`}).join('')}${nodes.map((a,i)=>`<circle cx="${a.x}" cy="${a.y}" r="4.6" fill="#fff3ac" class="spark-node" filter="url(#homeGlow)" style="animation-delay:${i*.11}s"/>`).join('')}</svg></div><p class="hint center">${n} shining connections · More appear as you practise.</p>`}

let musicOn=false;
const musicToggle=document.getElementById('musicToggle');
const musicVolume=document.getElementById('musicVolume');
musicVolume.value='85';musicPlayer.volume=.85;
function musicLabel(message){musicToggle.textContent=message;musicToggle.setAttribute('aria-pressed',String(musicOn));}
async function toggleMusic(){
 if(musicOn){musicPlayer.pause();musicOn=false;musicLabel('♫ Music: Off');return;}
 musicLabel('♫ Loading…');
 try{musicPlayer.muted=false;musicPlayer.volume=Number(musicVolume.value)/100;await musicPlayer.play();musicOn=true;musicLabel('♫ Music: On');}
 catch(e){musicOn=false;musicLabel('♫ Tap to try again');console.warn('Music playback unavailable:',e);}
}
musicToggle.addEventListener('click',toggleMusic);
musicVolume.addEventListener('input',()=>{musicPlayer.volume=Number(musicVolume.value)/100});
